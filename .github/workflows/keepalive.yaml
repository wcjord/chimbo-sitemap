name: Supabase keep-alive
on:
  schedule:
    - cron: "17 9 * * 1,4"   # Mon & Thu 09:17 UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database so the free-tier project stays active
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://qythjcoxbwwmdmevvpdx.supabase.co/rest/v1/features?select=id&limit=1" \
            -H "apikey: sb_publishable_Ic_6BjCADfZN8wVlrMCTgA_WhbMFh3j")
          echo "HTTP $code"
          test "$code" = "200"
